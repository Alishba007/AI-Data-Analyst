# docker-compose.yml
#
# Starts the whole stack with one command:
#   docker compose up --build
#
# First time only, pull the model into the Ollama container:
#   docker exec -it ai-data-analyst-ollama-1 ollama pull llama3.1
# (container name may differ slightly — check `docker ps` if unsure)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salesdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/salesdb
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama_models: